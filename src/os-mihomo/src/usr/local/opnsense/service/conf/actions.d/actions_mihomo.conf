[start]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh start
parameters:
type:script
message:starting mihomo

[stop]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh stop
parameters:
type:script
message:stopping mihomo

[restart]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh restart
parameters:
type:script
message:restarting mihomo
description:Restart mihomo service

[reload]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh reload
parameters:
type:script_output
message:reloading mihomo
description:Reload mihomo service

[status]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh status
parameters:
type:script_output
message:request mihomo status

[healthcheck]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh healthcheck
parameters:
type:script_output
message:request mihomo healthcheck

[watchdog]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/watchdog.sh
parameters:
type:script
message:Run Mihomo fail-open watchdog probe
description:Run Mihomo fail-open watchdog probe

# 参数只收一个词，CLI 多词会 Parameter mismatch
[failopen]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh failopen
parameters:%s
type:script
message:Trigger manual Fail-Open bypass for Mihomo

[version]
command:/usr/local/bin/mihomo -v 2>/dev/null || echo "Unknown"
parameters:
type:script_output
message:request mihomo version

[log]
command:/usr/bin/tail
parameters:-n %s /var/log/mihomo.log 2>/dev/null || true
type:script_output
message:request mihomo log

[system-status]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Mihomo/system_status.py
parameters:
type:script_output
message:request mihomo system status

[sub-update]
command:/usr/bin/mihomo_sub
parameters:
type:script_output
description:Renew mihomo Subscription

[secret-get]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/secret_manager.sh get
parameters:
type:script_output
message:get mihomo secret

[secret-generate]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/secret_manager.sh generate
parameters:
type:script_output
message:generate new mihomo secret

[secret-set]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/secret_manager.sh set
parameters:%s
type:script_output
message:set mihomo secret

[secret-masked]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/secret_manager.sh masked
parameters:
type:script_output
message:get masked mihomo secret

[config-atomic-update]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/atomic_config_updater.sh
parameters:%s %s
type:script_output
message:atomic update mihomo configuration

[sub-env-write]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Mihomo/subscription_env_writer.php
parameters:%s %s %s
type:script_output
message:write mihomo subscription env

[rules-apply]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/custom_rules_apply.sh apply
parameters:
type:script_output
message:apply mihomo custom rules

[rules-recompose]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/custom_rules_apply.sh recompose
parameters:
type:script_output
message:recompose mihomo config from cache

[transport-enable]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/transport_manager.sh enable
parameters:
type:script_output
message:enable mihomo transparent transport

[transport-disable]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/transport_manager.sh disable
parameters:
type:script_output
message:disable mihomo transparent transport

[transport-status]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/transport_manager.sh status
parameters:
type:script_output
message:mihomo transport status

[transport-recover]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/transport_manager.sh recover
parameters:
type:script_output
message:mihomo transport recovery probe

[hev-sync]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/transport_manager.sh hev-sync
parameters:
type:script_output
message:sync mihomo hev credentials and restart hev

[setup-cron]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Mihomo/mihomo_setup.php --cron-only
parameters:%s %s
type:script_output
message:rewrite mihomo cron.d schedule

[api-bind-apply]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/api_bind_manager.sh apply
parameters:%s %s
type:script_output
message:apply mihomo api bind settings


